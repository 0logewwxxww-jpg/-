name: Build Jawadain School Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name jawadain_school --org iq.school.jawadain --no-pub /tmp/jawadain-template
          cp -R /tmp/jawadain-template/android mobile/android

      - name: Configure Android release signing
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KEY_ALIAS secret" && exit 1)
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/jawadain-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/jawadain-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected Android Gradle Kotlin file was not generated")
          source = gradle.read_text()
          imports = "import java.util.Properties\nimport java.io.FileInputStream\n"
          if "import java.util.Properties" not in source:
              source = imports + source

          plugin_match = re.search(r"plugins\s*\{.*?\}", source, re.S)
          if not plugin_match:
              raise SystemExit("Could not locate plugins block in app/build.gradle.kts")

          signing_properties = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          source = source[:plugin_match.end()] + "\n\n" + signing_properties + source[plugin_match.end():]

          signing_config = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """
          if "signingConfigs {" not in source:
              source = re.sub(r"(?m)^\s*buildTypes\s*\{", signing_config + "    buildTypes {", source, count=1)
          source = re.sub(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("release")',
              source
          )
          if 'signingConfig = signingConfigs.getByName("release")' not in source:
              raise SystemExit("Could not configure release signing in Gradle file")
          gradle.write_text(source)
          PY

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Build signed release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: jawadain-school-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
